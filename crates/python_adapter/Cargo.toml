[package]
name = "memory_engine_py"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Python adapter for Memory Engine via PyO3"

[lib]
name = "memory_engine"
crate-type = ["cdylib"]

[dependencies]
memory_engine = { path = "../memory_engine" }
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
# PyO3 0.22's create_exception! expands its own legacy feature check here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }
