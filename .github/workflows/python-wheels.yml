name: Python wheels

on:
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/check_release_versions.py"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify source and release evidence
        id: source
        run: |
          working_tree=$(git status --porcelain)
          if [[ -n "$working_tree" ]]; then
            echo 'Wheel source checkout must be clean.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            python tools/check_release_versions.py --tag "$GITHUB_REF_NAME" --require-release-evidence
          else
            python tools/check_release_versions.py
          fi
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: manylinux_2_28_x86_64
          - os: windows-2022
            platform: win_amd64
    runs-on: ${{ matrix.os }}
    env:
      MEMORY_ENGINE_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      MEMORY_ENGINE_BUILD_DIRTY: "false"
      MEMORY_ENGINE_EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
      MEMORY_ENGINE_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      WHEEL_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.13.3
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          docker-options: -e MEMORY_ENGINE_BUILD_COMMIT -e MEMORY_ENGINE_BUILD_DIRTY
          args: --release --locked --manifest-path crates/python_adapter/Cargo.toml -i python3.12 --out dist
      - name: Build Windows wheel
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install maturin==1.13.3
          maturin build --release --locked --manifest-path crates/python_adapter/Cargo.toml --target x86_64-pc-windows-msvc -i python --out dist
      - name: Install and test the built wheel
        shell: bash
        run: |
          wheel="dist/memory_engine-${MEMORY_ENGINE_EXPECTED_VERSION}-cp312-cp312-${WHEEL_PLATFORM}.whl"
          python -m pip install --no-index --no-deps "$wheel"
          python -m pip install "pytest>=8.0" "jsonschema>=4.18,<5"
          python -I -m pytest crates/python_adapter/tests --require-api-contract-coverage
      - name: Store verified wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/memory_engine-${{ needs.prepare.outputs.version }}-cp312-cp312-${{ matrix.platform }}.whl
          if-no-files-found: error

  bundle:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      WHEEL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Record asset hashes
        working-directory: dist
        run: |
          prefix="memory_engine-${WHEEL_VERSION}-cp312-cp312"
          sha256sum "${prefix}-manylinux_2_28_x86_64.whl" "${prefix}-win_amd64.whl" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheels-cp312
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: [prepare, bundle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-python-wheels-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      WHEEL_COMMIT: ${{ needs.prepare.outputs.commit }}
      WHEEL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-wheels-cp312
          path: dist
      - name: Publish verified assets for the existing tag
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          ref_commit=$(jq -er '.object.sha' <<< "$tag_ref")
          if [[ "$(jq -er '.object.type' <<< "$tag_ref")" == tag ]]; then
            ref_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref_commit}" --jq '.object.sha')
          fi
          if [[ "$ref_commit" != "$WHEEL_COMMIT" ]]; then
            echo 'The release tag no longer points to the tested wheel commit.' >&2
            exit 1
          fi
          prefix="memory_engine-${WHEEL_VERSION}-cp312-cp312"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Memory Engine $GITHUB_REF_NAME" \
            --notes "CPython 3.12 wheels for Linux and Windows x86_64. Source commit: $WHEEL_COMMIT." \
            "${prefix}-manylinux_2_28_x86_64.whl" "${prefix}-win_amd64.whl" SHA256SUMS
