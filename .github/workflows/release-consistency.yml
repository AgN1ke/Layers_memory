name: Release consistency

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: manifests and release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release checker
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Check manifest versions
        run: python tools/check_release_versions.py

      - name: Check tagged release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python tools/check_release_versions.py
          --tag "${{ github.ref_name }}"
          --require-release-evidence
